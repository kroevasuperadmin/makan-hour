name: Android Play internal

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        required: false
        default: internal
  push:
    tags: ["android-v*"]

concurrency:
  group: android-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/makan-hour
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        working-directory: .
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for v in KS KSP KA KP SA SB_URL SB_ANON; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        working-directory: .
        run: npm ci

      - name: Write app env (baked into the JS bundle)
        env:
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SB_URL" "$SB_ANON" > .env

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/keys/upload.keystore"
          echo "MAKAN_UPLOAD_STORE_FILE=$RUNNER_TEMP/keys/upload.keystore" >> "$GITHUB_ENV"

      - name: Version code from run number
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build signed .aab
        working-directory: apps/makan-hour/android
        env:
          MAKAN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAKAN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAKAN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" app/build.gradle
          ./gradlew --no-daemon bundleRelease
          ls -l app/build/outputs/bundle/release/

      - name: Upload to Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.wildrice.makanhour
          releaseFiles: apps/makan-hour/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft

      - name: Clean up keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" .env
